<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-labelledby="title desc">
  <title id="title">라그도그 시스템 아키텍처와 질문 처리 흐름</title>
  <desc id="desc">반려견 건강 RAG, 동물병원 SQLite 검색, 반려동물 보고서 분석의 데이터와 처리 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#7b61ff"/>
    </marker>
    <style>
      .title { font: 800 38px 'Noto Sans KR', Arial, sans-serif; fill: #17233f; }
      .subtitle { font: 600 20px 'Noto Sans KR', Arial, sans-serif; fill: #66728d; }
      .section { font: 800 27px 'Noto Sans KR', Arial, sans-serif; fill: #17233f; }
      .box-title { font: 800 21px 'Noto Sans KR', Arial, sans-serif; fill: #17233f; }
      .box-copy { font: 500 17px 'Noto Sans KR', Arial, sans-serif; fill: #40506f; }
      .small { font: 600 15px 'Noto Sans KR', Arial, sans-serif; fill: #59677f; }
      .arrow { stroke: #7b61ff; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .line { stroke: #c8cce0; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#fbfbff"/>
  <rect x="35" y="30" width="1530" height="1070" rx="32" fill="#ffffff" stroke="#e5e6f2" stroke-width="2"/>
  <text x="85" y="105" class="title">라그도그(RagDog) 아키텍처</text>
  <text x="85" y="140" class="subtitle">반려견 건강 정보 · 지역 동물병원 · 2025 반려동물 보고서 기반 질의응답</text>

  <rect x="80" y="180" width="1440" height="395" rx="24" fill="#f7f6ff"/>
  <text x="115" y="230" class="section">1. 데이터와 서비스 구성</text>

  <rect x="120" y="270" width="270" height="210" rx="18" fill="#eaf7f0" stroke="#b9e7ce" stroke-width="2"/>
  <text x="150" y="315" class="box-title">건강 Q&amp;A 데이터</text>
  <text x="150" y="348" class="box-copy">df.csv</text>
  <text x="150" y="378" class="box-copy">연령 · 진료과 · 질병</text>
  <text x="150" y="408" class="box-copy">질문 · 답변</text>
  <text x="150" y="444" class="small">20,417개 원천 Q&amp;A</text>

  <rect x="120" y="500" width="270" height="52" rx="14" fill="#eaf7f0"/>
  <text x="150" y="534" class="small">KB 2025 보고서 PDF</text>

  <path d="M405 350 H510" class="arrow"/>
  <path d="M405 526 H510 V405" class="arrow"/>

  <rect x="525" y="298" width="310" height="190" rx="18" fill="#edeaff" stroke="#cbbfff" stroke-width="2"/>
  <text x="555" y="343" class="box-title">Chroma 벡터 저장소</text>
  <text x="555" y="378" class="box-copy">pet_care</text>
  <text x="555" y="408" class="box-copy">pet_analysis_1024</text>
  <text x="555" y="450" class="small">임베딩 기반 유사도 검색</text>

  <path d="M850 392 H950" class="arrow"/>
  <rect x="965" y="298" width="250" height="190" rx="18" fill="#fff5dd" stroke="#f3ce82" stroke-width="2"/>
  <text x="995" y="343" class="box-title">LLM 답변 생성</text>
  <text x="995" y="378" class="box-copy">검색 근거 +</text>
  <text x="995" y="408" class="box-copy">대화 이력 + 질문</text>
  <text x="995" y="450" class="small">근거 밖 추측 금지</text>

  <path d="M1230 392 H1330" class="arrow"/>
  <rect x="1345" y="298" width="135" height="190" rx="18" fill="#f0f4ff" stroke="#becdf8" stroke-width="2"/>
  <text x="1373" y="355" class="box-title">Streamlit</text>
  <text x="1380" y="388" class="box-copy">답변</text>
  <text x="1365" y="420" class="box-copy">검색 근거</text>
  <text x="1380" y="452" class="box-copy">대시보드</text>

  <rect x="80" y="620" width="1440" height="430" rx="24" fill="#f7f6ff"/>
  <text x="115" y="670" class="section">2. 질문별 시스템 흐름</text>

  <rect x="120" y="780" width="180" height="120" rx="18" fill="#ffffff" stroke="#cbbfff" stroke-width="2"/>
  <text x="160" y="832" class="box-title">사용자 질문</text>
  <text x="145" y="868" class="small">최근 대화 최대 6턴</text>

  <path d="M315 840 H410" class="arrow"/>
  <rect x="425" y="780" width="200" height="120" rx="18" fill="#edeaff" stroke="#cbbfff" stroke-width="2"/>
  <text x="470" y="832" class="box-title">질문 라우터</text>
  <text x="457" y="868" class="small">rag · sql · analysis · none</text>

  <path d="M640 815 H690 V736 H730" class="arrow"/>
  <path d="M640 840 H730" class="arrow"/>
  <path d="M640 865 H690 V956 H730" class="arrow"/>

  <rect x="745" y="690" width="245" height="92" rx="16" fill="#eaf7f0" stroke="#b9e7ce" stroke-width="2"/>
  <text x="775" y="733" class="box-title">rag_tool · 건강 RAG</text>
  <text x="775" y="762" class="small">건강 · 증상 질문</text>

  <rect x="745" y="800" width="245" height="92" rx="16" fill="#fff5dd" stroke="#f3ce82" stroke-width="2"/>
  <text x="775" y="843" class="box-title">sql_tool · 병원 검색</text>
  <text x="775" y="872" class="small">지역 · 주소 · 병원명</text>

  <rect x="745" y="910" width="290" height="92" rx="16" fill="#e7f2ff" stroke="#abcffa" stroke-width="2"/>
  <text x="775" y="953" class="box-title">report_analysis_tool</text>
  <text x="775" y="982" class="small">통계 · 추이 · 비교 분석</text>

  <path d="M1005 736 H1160 V810 H1220" class="arrow"/>
  <path d="M1005 846 H1220" class="arrow"/>
  <path d="M1050 956 H1160 V900 H1220" class="arrow"/>
  <rect x="1235" y="770" width="230" height="190" rx="18" fill="#ffffff" stroke="#cbbfff" stroke-width="2"/>
  <text x="1280" y="824" class="box-title">Streamlit UI</text>
  <text x="1280" y="860" class="box-copy">답변 표시</text>
  <text x="1280" y="892" class="box-copy">검색 근거</text>
  <text x="1280" y="924" class="box-copy">병원 지도</text>
</svg>
