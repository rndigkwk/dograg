<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-label="라그도그 LangGraph 챗봇 구조: 질문 라우터가 건강 상담(하이브리드 검색과 CRAG), 병원 검색(SQLite), 보고서 분석(OpenAI 임베딩), 일반 대화로 분기한다">
  <style>
    text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #1f2937; }
    .title { font-size: 22px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .t { font-size: 12.5px; fill: #4b5563; }
    .lbl { font-size: 12px; font-weight: 700; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.2; }
    .health { fill: #fff7ed; stroke: #fb923c; }
    .sql { fill: #eff6ff; stroke: #60a5fa; }
    .report { fill: #f5f3ff; stroke: #a78bfa; }
    .none { fill: #f3f4f6; stroke: #9ca3af; }
    .router { fill: #fefce8; stroke: #eab308; }
    .ok { fill: #ecfdf5; stroke: #34d399; }
    .stop { fill: #fef2f2; stroke: #f87171; }
    .band { fill: #f9fafb; stroke: #e5e7eb; }
    .arrow { stroke: #6b7280; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .dash { stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1100" height="700" fill="#ffffff"/>
  <text x="30" y="40" class="title">라그도그 챗봇 구조 (LangGraph)</text>

  <!-- question and router -->
  <rect x="400" y="62" width="300" height="48" rx="10" class="box"/>
  <text x="550" y="84" text-anchor="middle" class="h">사용자 질문</text>
  <text x="550" y="102" text-anchor="middle" class="t">+ 최근 대화 최대 6턴</text>
  <path d="M550 110 V136" class="arrow"/>
  <rect x="300" y="138" width="500" height="66" rx="10" class="router"/>
  <text x="550" y="162" text-anchor="middle" class="h">질문 라우터 (classify)</text>
  <text x="550" y="182" text-anchor="middle" class="t">신호가 하나면 키워드 규칙으로 즉시 결정</text>
  <text x="550" y="198" text-anchor="middle" class="t">신호가 충돌하거나 없으면 LLM 구조화 출력으로 결정</text>

  <path d="M380 204 L230 224" class="arrow"/>
  <path d="M520 204 L560 224" class="arrow"/>
  <path d="M640 204 L805 224" class="arrow"/>
  <path d="M780 204 L1010 224" class="arrow"/>

  <!-- health -->
  <text x="230" y="240" text-anchor="middle" class="lbl">건강 상담 · rag</text>
  <rect x="30" y="248" width="400" height="58" rx="10" class="health"/>
  <text x="230" y="272" text-anchor="middle" class="h">하이브리드 검색</text>
  <text x="230" y="292" text-anchor="middle" class="t">ko-sroberta Dense + Kiwi BM25 → RRF, 후보 5건</text>
  <path d="M230 306 V330" class="arrow"/>
  <rect x="30" y="332" width="400" height="58" rx="10" class="health"/>
  <text x="230" y="356" text-anchor="middle" class="h">CRAG 근거 평가 (LLM)</text>
  <text x="230" y="376" text-anchor="middle" class="t">질문에 쓸모 있는 문서만 골라 순서를 정함</text>
  <path d="M150 390 V430" class="arrow"/>
  <text x="158" y="416" class="t">근거 있음</text>
  <path d="M330 390 V430" class="arrow"/>
  <text x="338" y="416" class="t">근거 없음</text>
  <rect x="30" y="432" width="190" height="72" rx="10" class="ok"/>
  <text x="125" y="458" text-anchor="middle" class="h">근거만으로 답변</text>
  <text x="125" y="477" text-anchor="middle" class="t">근거 목록 표시</text>
  <text x="125" y="494" text-anchor="middle" class="t">응급 표현이면 진료 권고</text>
  <rect x="240" y="432" width="190" height="72" rx="10" class="health"/>
  <text x="335" y="458" text-anchor="middle" class="h">검색어 재작성 1회</text>
  <text x="335" y="477" text-anchor="middle" class="t">재검색 후 다시 평가</text>
  <text x="335" y="494" text-anchor="middle" class="t">(근거 있으면 왼쪽으로)</text>
  <path d="M335 504 V528" class="arrow"/>
  <rect x="240" y="530" width="190" height="56" rx="10" class="stop"/>
  <text x="335" y="554" text-anchor="middle" class="h">답변 보류</text>
  <text x="335" y="573" text-anchor="middle" class="t">+ 가까운 병원 찾기 링크</text>

  <!-- sql -->
  <text x="560" y="240" text-anchor="middle" class="lbl">병원 검색 · sql</text>
  <rect x="460" y="248" width="200" height="58" rx="10" class="sql"/>
  <text x="560" y="272" text-anchor="middle" class="h">SQLite hospital</text>
  <text x="560" y="292" text-anchor="middle" class="t">5,448곳 · 읽기 전용 SQL</text>
  <path d="M560 306 V330" class="arrow"/>
  <rect x="460" y="332" width="200" height="58" rx="10" class="sql"/>
  <text x="560" y="356" text-anchor="middle" class="h">위치를 허용하면</text>
  <text x="560" y="376" text-anchor="middle" class="t">EPSG:5174→WGS84 직선거리순</text>
  <path d="M560 390 V430" class="arrow"/>
  <rect x="460" y="432" width="200" height="72" rx="10" class="ok"/>
  <text x="560" y="462" text-anchor="middle" class="h">병원 목록 (최대 10곳)</text>
  <text x="560" y="482" text-anchor="middle" class="t">버튼으로 지도 화면 이동</text>

  <!-- report -->
  <text x="805" y="240" text-anchor="middle" class="lbl">보고서 분석 · analysis</text>
  <rect x="690" y="248" width="230" height="58" rx="10" class="report"/>
  <text x="805" y="272" text-anchor="middle" class="h">보고서 벡터 검색</text>
  <text x="805" y="292" text-anchor="middle" class="t">OpenAI 3-small · PDF 5개 1,193청크</text>
  <path d="M805 306 V330" class="arrow"/>
  <rect x="690" y="332" width="230" height="58" rx="10" class="report"/>
  <text x="805" y="356" text-anchor="middle" class="h">LLM 요약</text>
  <text x="805" y="376" text-anchor="middle" class="t">확인된 수치만, 보고서·페이지 인용</text>
  <path d="M805 390 V430" class="arrow"/>
  <rect x="690" y="432" width="230" height="72" rx="10" class="ok"/>
  <text x="805" y="462" text-anchor="middle" class="h">답변 + 근거 발췌</text>
  <text x="805" y="482" text-anchor="middle" class="t">원문 PDF 페이지 미리보기</text>

  <!-- none -->
  <text x="1010" y="240" text-anchor="middle" class="lbl">그 밖 · none</text>
  <rect x="950" y="248" width="120" height="58" rx="10" class="none"/>
  <text x="1010" y="272" text-anchor="middle" class="h">일반 대화</text>
  <text x="1010" y="292" text-anchor="middle" class="t">검색 없이 응답</text>

  <!-- bottom bands -->
  <rect x="30" y="612" width="1040" height="34" rx="8" class="band"/>
  <text x="46" y="634" class="t"><tspan font-weight="700" fill="#1f2937">실행 로그</tspan>  output/chat_runs.jsonl · 경로, CRAG 판정, 재작성 횟수, 토큰 사용량 (질문 원문 대신 해시·길이만)</text>
  <rect x="30" y="652" width="1040" height="34" rx="8" class="band"/>
  <text x="46" y="674" class="t"><tspan font-weight="700" fill="#1f2937">배포</tspan>  Streamlit Community Cloud (2코어·2.7GB) · 시작 시 백그라운드 워밍업 + BM25 토큰 캐시 · 스레드·메모리 제한</text>
</svg>
