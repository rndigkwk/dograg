    "langchain>=1.0",
    "langchain-openai>=1.0",
    "pyyaml>=6.0",
    # day19 — LangChain 에이전트·툴(RAG 를 LangChain 부품으로·Text-to-SQL)
    #   Text-to-SQL 은 sqlite(표준 라이브러리)라 새 의존성이 없다.
    "langchain-chroma>=0.2",
    "langchain-huggingface>=0.3",
    "langchain-text-splitters>=1.0",
    "streamlit>=1.61.1",
    "fil>=1.6.0",
    "pyproj>=3.7.2",
    "pillow>=12.3.0",
    "matplotlib>=3.11.1",
    "plotly>=6.9.0",
    "seaborn>=0.13.2",
    "kiwipiepy>=0.22.2",
    "rank-bm25>=0.2.2",
]
