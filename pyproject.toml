[project]
name = "enkoa-practice-llm-agent"
version = "0.1.0"
description = "엔코아 AI캠퍼스 LLM·에이전트 실습자료"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "numpy>=2.3,<2.5",
    "openai>=1.0",
    "pandas>=2.3,<3",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    # day15 — 벡터 검색·벡터 DB
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "chromadb>=1.0",
    "qdrant-client>=1.12",
    # day16 — 문서 파싱·RAG 파이프라인
    "pymupdf4llm>=1.28.0",
    "pymupdf>=1.28.0",
    "requests>=2.32",
    # day17 — 데이터베이스·SQL (Supabase·pgvector)
    "supabase>=2.15",
    # day18 — LangChain 기본 구조(모델·프롬프트·파서·LCEL·Runnable·Memory)
