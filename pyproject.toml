[project]
name = "dograg"
version = "0.1.0"
description = "라그도그: 반려견 건강 상담·반려동물 시설 검색·보고서 분석 RAG 챗봇"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3,<2.5",
    "openai>=1.0",
    "pandas>=2.3,<3",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "chromadb>=1.0",
    "pymupdf>=1.28.0",
    "requests>=2.32",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-chroma>=0.2",
    "langchain-text-splitters>=1.0",
    "streamlit>=1.61.1",
    "pyproj>=3.7.2",
    "pillow>=12.3.0",
    "matplotlib>=3.11.1",
    "plotly>=6.9.0",
    "kiwipiepy>=0.22.2",
    "rank-bm25>=0.2.2",
    "onnxruntime>=1.20",
    "langfuse>=4.17.0",
    # Question embeddings run on onnxruntime with these two (src/onnx_embeddings.py).
    "huggingface-hub>=1.0",
    "tokenizers>=0.21",
    "httpx>=0.27",
]

[dependency-groups]
# PyTorch models for the embedding fine-tuning, evaluation and memory scripts
# (`uv run --group tools python scripts/...`). The app never imports torch, so the
# deployment does not install it.
tools = [
    "sentence-transformers>=3.0",
]
# Opening the notebooks locally (`uv sync --group notebook`); not installed for the app.
notebook = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
]
