name: Streamlit app checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: streamlit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --no-install-project

      - name: Download the private data
        # AI Hub data is not in this repository (src/private_data.py). Without the HF_TOKEN secret
        # (e.g. a pull request from a fork) the tests that read it are skipped.
        if: ${{ env.HF_TOKEN != '' }}
        run: .venv/bin/python -m src.private_data

      - name: Run feature and regression tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: .venv/bin/python -m compileall -q main.py app_pages src tests scripts team
