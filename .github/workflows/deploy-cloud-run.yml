name: Deploy to Cloud Run

# Builds the container image (Dockerfile: private data and model baked in, HF_TOKEN as a build
# secret), pushes it to the private Artifact Registry repository and deploys the API for the
# Next.js frontend to Cloud Run (service ragdog-api, docs/adr/0008). Until 2026-10-23 the same image
# also ran the Streamlit app as service ragdog; that service showed only a notice after P5 and was
# removed (the fallback is Streamlit Cloud on branch streamlit-backup, docs/runbook-manual-deploy.md).
#
# One-time setup: scripts/gcp/setup_cloud_run.sh in Cloud Shell, then the repository variable
# GCP_WORKLOAD_IDENTITY_PROVIDER (Settings > Secrets and variables > Actions > Variables).
# Authentication is keyless (Workload Identity Federation): no service account key is stored.
# Optional: the repository secret VERCEL_DEPLOY_HOOK_URL rebuilds the web when the API's data changed
# (the last step).
on:
  push:
    branches: [main]
    # Not in the image or never read by it: the frontend (Vercel), the docs (.dockerignore) and
    # Markdown anywhere (README and notes; no .md is read at run time). A push that also changes
    # code still deploys.
    paths-ignore: ["web/**", ".github/workflows/web-ci.yml", "docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      fault:
        description: "Canary drill: chat = a broken API candidate (the check must fail), supabase = its database down (the check must pass on local search), openai = OpenAI unreachable (the check must pass on Claude). Never promoted."
        type: choice
        options: [none, chat, supabase, openai]
        default: none

permissions:
  contents: read
  id-token: write  # the OIDC token Workload Identity Federation exchanges

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: ragdog-511311
  REGION: asia-northeast3
  API_SERVICE: ragdog-api
  IMAGE: asia-northeast3-docker.pkg.dev/ragdog-511311/ragdog/app
  DEPLOYER: github-deployer@ragdog-511311.iam.gserviceaccount.com
  RUNTIME: ragdog-runtime@ragdog-511311.iam.gserviceaccount.com

jobs:
  deploy:
    # Skipped (not failed) until the one-time setup has been done.
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Build and push the image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --secret id=hf_token,env=HF_TOKEN -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Deploy the API
        # The image, started as the FastAPI server (api/main.py). Two instances at most (the cost cap). A visit report paused for the guardian's
        # answer waits in Supabase (src/visit_prep_store.py, schema visit_prep), so the answer may reach
        # either instance and survives a deploy. No session affinity: the browser calls with fetch and
        # no cookies. 15 minutes per request: a report streams for
        # one to two minutes. RAGDOG_WEB_ORIGINS (repository variable) lists the frontend's origins
        # for CORS; until the frontend exists only the local dev server is allowed.
        env:
          SEARCH_BACKEND: ${{ secrets.SEARCH_BACKEND }}
          FAULT: ${{ inputs.fault || 'none' }}
          WEB_ORIGINS: ${{ vars.RAGDOG_WEB_ORIGINS }}
          WEB_ORIGIN_REGEX: ${{ vars.RAGDOG_WEB_ORIGIN_REGEX }}
        run: |
          secrets="OPENAI_API_KEY=OPENAI_API_KEY:latest,LANGFUSE_PUBLIC_KEY=LANGFUSE_PUBLIC_KEY:latest,LANGFUSE_SECRET_KEY=LANGFUSE_SECRET_KEY:latest"
          # Claude Haiku answers when OpenAI fails (src/resources.py with_claude_fallback).
          secrets="$secrets,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,ANTHROPIC_WORKSPACE_ID=ANTHROPIC_WORKSPACE_ID:latest"
          backend=local
          if [ "$SEARCH_BACKEND" = supabase ]; then
            backend=supabase
            secrets="$secrets,SUPABASE_DB_URL=SUPABASE_DB_URL:latest"
          fi
          # ^|^ : env values may hold commas (the origin list), so the variables are split on "|".
          env_vars="^|^ENABLE_CRAG=true|SEARCH_BACKEND=$backend|LANGFUSE_BASE_URL=https://us.cloud.langfuse.com|LANGFUSE_TRACING_ENVIRONMENT=cloudrun-api|LANGFUSE_RELEASE=$GITHUB_SHA"
          [ -n "$WEB_ORIGINS" ] && env_vars="$env_vars|RAGDOG_WEB_ORIGINS=$WEB_ORIGINS"
          [ -n "$WEB_ORIGIN_REGEX" ] && env_vars="$env_vars|RAGDOG_WEB_ORIGIN_REGEX=$WEB_ORIGIN_REGEX"
          [ "$FAULT" != none ] && env_vars="$env_vars|RAGDOG_FAULT=$FAULT"
          # Canary: the new revision starts with no traffic, reachable only at the "candidate" tag URL.
          # The next step checks it there; only then does the traffic move (docs/wiki/cloud-run.md).
          gcloud run deploy "$API_SERVICE" --image="$IMAGE:$GITHUB_SHA" --region="$REGION" \
            --service-account="$RUNTIME" --memory=2Gi --cpu=1 --cpu-boost \
            --min-instances=0 --max-instances=2 --no-session-affinity --timeout=900 \
            --allow-unauthenticated \
            --command=uvicorn --args=api.main:app,--host,0.0.0.0,--port,8080 \
            --set-secrets="$secrets" --set-env-vars="$env_vars" \
            --no-traffic --tag=candidate

      - name: Check the API candidate before it gets traffic
        # scripts/canary_check.py: health and commit, the places and fee tables, a date question
        # (no model) and a health question (about 4 model calls). A failure here leaves all traffic on
        # the revision that was serving: the job fails, and alert-on-failure.yml opens an issue.
        # No 10% step: at a few questions an hour, a share of the traffic says nothing in minutes.
        # fault=supabase: the candidate's database is down; the answers must come from local search.
        # fault=openai: the candidate cannot reach OpenAI; the health question must be answered by
        # Claude (src/resources.py), as the quota notice ("degraded") fails the check.
        env:
          FAULT: ${{ inputs.fault || 'none' }}
        run: |
          # pipefail: without it the step takes tee's exit status, and a failed check would still promote.
          set -o pipefail
          url="$(gcloud run services describe "$API_SERVICE" --region="$REGION" --format='value(status.url)')"
          candidate="https://candidate---${url#https://}"
          echo "### API candidate: $candidate" >> "$GITHUB_STEP_SUMMARY"
          expect=""
          [ "$FAULT" = supabase ] && expect="--expect-search local"
          # $expect unquoted on purpose: empty, or the flag and its value.
          python3 scripts/canary_check.py "$candidate" --expect-commit "$GITHUB_SHA" $expect \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compare the pages' data with the serving API
        # The places, data and fee pages are rendered on Vercel with these answers and kept for a day
        # (revalidate = 86400, web/src/lib/prefetch.ts), and Vercel builds a push before this workflow
        # ends: on 2026-10-29 the web showed the old place kinds until a manual redeploy. When the
        # candidate answers differently (or either does not answer), the last step rebuilds the web.
        id: data
        if: ${{ (inputs.fault || 'none') == 'none' }}
        run: |
          url="$(gcloud run services describe "$API_SERVICE" --region="$REGION" --format='value(status.url)')"
          candidate="https://candidate---${url#https://}"
          changed=false
          for path in /places/kinds /places/regions /stats/overview /fees/items; do
            # 60 s: the serving revision may have scaled to zero (15-27 s to wake).
            old="$(curl -sf --max-time 60 "$url$path" || true)"
            new="$(curl -sf --max-time 60 "$candidate$path" || true)"
            if [ -z "$old" ] || [ -z "$new" ] || [ "$old" != "$new" ]; then
              echo "$path: changed or no answer"
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Promote the API candidate
        # All traffic to the new revision. This also undoes a rollback (rollback-api.yml), which pins
        # the traffic to an older revision. A drill candidate (input fault) is never promoted.
        if: ${{ (inputs.fault || 'none') == 'none' }}
        run: gcloud run services update-traffic "$API_SERVICE" --region="$REGION" --to-latest

      - name: Check the deployed API
        # /health reports the commit (LANGFUSE_RELEASE): the new revision must be the one serving.
        if: ${{ (inputs.fault || 'none') == 'none' }}
        run: |
          url="$(gcloud run services describe "$API_SERVICE" --region="$REGION" --format='value(status.url)')"
          for attempt in $(seq 1 30); do
            body="$(curl -s "$url/health" || true)"
            if echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              echo "### Cloud Run API: $url (health ok, commit ${GITHUB_SHA::7}, attempt $attempt)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$url/health did not report $GITHUB_SHA (last: $body)"
          exit 1

      - name: Rebuild the web when its data changed
        # A Vercel Deploy Hook for branch main (Vercel > Project > Settings > Git > Deploy Hooks),
        # stored as the repository secret VERCEL_DEPLOY_HOOK_URL: the new build renders the pages
        # from the promoted API. Without the secret the step only leaves a notice. The URL is the
        # credential: never echo it (curl -s prints neither the URL nor the response).
        if: ${{ steps.data.outputs.changed == 'true' }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::The pages' data changed but VERCEL_DEPLOY_HOOK_URL is not set: redeploy the web on Vercel by hand."
            exit 0
          fi
          curl -sf -X POST --max-time 30 -o /dev/null "$HOOK"
          echo "### Web: the pages' data changed, Vercel rebuild requested" >> "$GITHUB_STEP_SUMMARY"
