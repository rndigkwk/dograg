name: Deploy to Cloud Run

# Builds the container image (Dockerfile: private data and model baked in, HF_TOKEN as a build
# secret), pushes it to the private Artifact Registry repository and deploys it to Cloud Run twice:
# the Streamlit app (service ragdog, docs/wiki/cloud-run.md) and, from the same image with another
# command, the API for the Next.js frontend (service ragdog-api, docs/adr/0008).
#
# One-time setup: scripts/gcp/setup_cloud_run.sh in Cloud Shell, then the repository variable
# GCP_WORKLOAD_IDENTITY_PROVIDER (Settings > Secrets and variables > Actions > Variables).
# Authentication is keyless (Workload Identity Federation): no service account key is stored.
on:
  push:
    branches: [main]
    paths-ignore: ["web/**", ".github/workflows/web-ci.yml"]  # the frontend is not in the image
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # the OIDC token Workload Identity Federation exchanges

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  PROJECT_ID: ragdog-511311
  REGION: asia-northeast3
  SERVICE: ragdog
  API_SERVICE: ragdog-api
  IMAGE: asia-northeast3-docker.pkg.dev/ragdog-511311/ragdog/app
  DEPLOYER: github-deployer@ragdog-511311.iam.gserviceaccount.com
  RUNTIME: ragdog-runtime@ragdog-511311.iam.gserviceaccount.com

jobs:
  deploy:
    # Skipped (not failed) until the one-time setup has been done.
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Build and push the image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --secret id=hf_token,env=HF_TOKEN -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Deploy
        # 2 GiB: 1.06 GiB peak measured with a visit report (docs/wiki/cloud-run.md).
        # At most 2 instances: the cost cap, and the visit report's paused runs live in one
        # server's memory, so session affinity keeps a browser on the same instance.
        # Streamlit keeps a websocket open per tab: the timeout is the longest a tab stays connected.
        # Settings mirror the Streamlit Cloud secrets (ENABLE_CRAG, Langfuse); HF_TOKEN is not needed
        # at run time because the data and the model are in the image.
        # Search in Supabase (docs/adr/0007) when the repository secret SEARCH_BACKEND is "supabase":
        # the database URL then comes from the Secret Manager secret SUPABASE_DB_URL (created once by
        # scripts/gcp/setup_cloud_run.sh), like the other runtime secrets.
        env:
          SEARCH_BACKEND: ${{ secrets.SEARCH_BACKEND }}
        run: |
          secrets="OPENAI_API_KEY=OPENAI_API_KEY:latest,LANGFUSE_PUBLIC_KEY=LANGFUSE_PUBLIC_KEY:latest,LANGFUSE_SECRET_KEY=LANGFUSE_SECRET_KEY:latest"
          backend=local
          if [ "$SEARCH_BACKEND" = supabase ]; then
            backend=supabase
            secrets="$secrets,SUPABASE_DB_URL=SUPABASE_DB_URL:latest"
          fi
          echo "### Search backend: $backend" >> "$GITHUB_STEP_SUMMARY"
          gcloud run deploy "$SERVICE" --image="$IMAGE:$GITHUB_SHA" --region="$REGION" \
            --service-account="$RUNTIME" --memory=2Gi --cpu=1 --cpu-boost \
            --min-instances=0 --max-instances=2 --session-affinity --timeout=3600 \
            --allow-unauthenticated \
            --set-secrets="$secrets" \
            --set-env-vars="ENABLE_CRAG=true,SEARCH_BACKEND=$backend,LANGFUSE_BASE_URL=https://us.cloud.langfuse.com,LANGFUSE_TRACING_ENVIRONMENT=cloudrun,LANGFUSE_RELEASE=$GITHUB_SHA"

      - name: Deploy the API
        # The same image and settings as the app, started as the FastAPI server (api/main.py).
        # Two instances at most (the cost cap, like the app). A visit report paused for the guardian's
        # answer waits in Supabase (src/visit_prep_store.py, schema visit_prep), so the answer may reach
        # either instance and survives a deploy. No session affinity: the browser calls with fetch and
        # no cookies. 15 minutes per request: a report streams for
        # one to two minutes. RAGDOG_WEB_ORIGINS (repository variable) lists the frontend's origins
        # for CORS; until the frontend exists only the local dev server is allowed.
        env:
          SEARCH_BACKEND: ${{ secrets.SEARCH_BACKEND }}
          WEB_ORIGINS: ${{ vars.RAGDOG_WEB_ORIGINS }}
          WEB_ORIGIN_REGEX: ${{ vars.RAGDOG_WEB_ORIGIN_REGEX }}
        run: |
          secrets="OPENAI_API_KEY=OPENAI_API_KEY:latest,LANGFUSE_PUBLIC_KEY=LANGFUSE_PUBLIC_KEY:latest,LANGFUSE_SECRET_KEY=LANGFUSE_SECRET_KEY:latest"
          backend=local
          if [ "$SEARCH_BACKEND" = supabase ]; then
            backend=supabase
            secrets="$secrets,SUPABASE_DB_URL=SUPABASE_DB_URL:latest"
          fi
          # ^|^ : env values may hold commas (the origin list), so the variables are split on "|".
          env_vars="^|^ENABLE_CRAG=true|SEARCH_BACKEND=$backend|LANGFUSE_BASE_URL=https://us.cloud.langfuse.com|LANGFUSE_TRACING_ENVIRONMENT=cloudrun-api|LANGFUSE_RELEASE=$GITHUB_SHA"
          [ -n "$WEB_ORIGINS" ] && env_vars="$env_vars|RAGDOG_WEB_ORIGINS=$WEB_ORIGINS"
          [ -n "$WEB_ORIGIN_REGEX" ] && env_vars="$env_vars|RAGDOG_WEB_ORIGIN_REGEX=$WEB_ORIGIN_REGEX"
          gcloud run deploy "$API_SERVICE" --image="$IMAGE:$GITHUB_SHA" --region="$REGION" \
            --service-account="$RUNTIME" --memory=2Gi --cpu=1 --cpu-boost \
            --min-instances=0 --max-instances=2 --no-session-affinity --timeout=900 \
            --allow-unauthenticated \
            --command=uvicorn --args=api.main:app,--host,0.0.0.0,--port,8080 \
            --set-secrets="$secrets" --set-env-vars="$env_vars"

      - name: Check the deployed service
        run: |
          url="$(gcloud run services describe "$SERVICE" --region="$REGION" --format='value(status.url)')"
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url/_stcore/health" || true)"
            if [ "$code" = 200 ]; then
              echo "### Cloud Run: $url (health 200, attempt $attempt)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$url/_stcore/health did not answer 200 (last: $code)"
          exit 1

      - name: Check the deployed API
        # /health reports the commit (LANGFUSE_RELEASE): the new revision must be the one serving.
        run: |
          url="$(gcloud run services describe "$API_SERVICE" --region="$REGION" --format='value(status.url)')"
          for attempt in $(seq 1 30); do
            body="$(curl -s "$url/health" || true)"
            if echo "$body" | grep -q "\"commit\":\"$GITHUB_SHA\""; then
              echo "### Cloud Run API: $url (health ok, commit ${GITHUB_SHA::7}, attempt $attempt)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$url/health did not report $GITHUB_SHA (last: $body)"
          exit 1
