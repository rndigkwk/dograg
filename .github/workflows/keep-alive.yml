name: Keep deployed app awake and working

# Every 8 hours the serving API gets the deploy canary's four checks (scripts/canary_check.py:
# /health, the tables, a date question, a health question through the search and the answer
# model), and the web app's pages must answer 200, so a deployment that is up but broken fails the
# run. Cloud Run scales to zero between visits: the scheduled runs record its cold start.
# Until 2026-10-23 a headless browser opened the Cloud Run Streamlit service here
# (scripts/check_deployed_app.py). Since P5 that service, like the old Streamlit Cloud address
# (branch streamlit-backup), shows only a notice pointing to the web app (main.py).
# A push to main is not a trigger any more: the deploy workflow runs the same canary on the new
# revision and checks the API once it serves (deploy-cloud-run.yml).
on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployed-app-check
  cancel-in-progress: true

env:
  API_URL: https://ragdog-api-892238791473.asia-northeast3.run.app
  WEB_URL: https://ragdog-rndigkwks-projects.vercel.app

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: The serving API answers like a new revision must
        # No --expect-commit: a deploy may be on its way; deploy-cloud-run.yml checks the commit.
        run: python3 scripts/canary_check.py "$API_URL"

      - name: The web app's pages answer
        run: |
          for path in / /chat /places /fees /care /visit-prep; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$WEB_URL$path" || true)"
            echo "$path $code"
            if [ "$code" != 200 ]; then
              echo "::error::$WEB_URL$path answered $code"
              exit 1
            fi
          done

  database:
    # The canary above asks the API a health question; with SEARCH_BACKEND=supabase (docs/adr/0007)
    # that search must have used the Supabase vector index during this run. Otherwise the API
    # answered from the local fallback and Supabase is failing for them. The query also counts as
    # database activity, so the free project is not paused for inactivity.
    needs: wake
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SEARCH_BACKEND: ${{ secrets.SEARCH_BACKEND }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RAGDOG_EVAL_HISTORY: "1"  # the database row of ragdog_eval_history
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Check that the searches reached Supabase
        run: |
          if [ "$SEARCH_BACKEND" != supabase ]; then
            echo "Search backend is not Supabase; nothing to check."
            exit 0
          fi
          uv run --no-project --with "psycopg[binary]" python scripts/check_supabase_search.py --minutes 40
