name: Weekly regression evaluation

# Runs the CRAG answer/abstain set (60), the place routing set (41), the care-guide set (16) and the
# visit-prep team set (12 consultations, with node visit counts) as Langfuse experiments with real model calls, scores
# 100 health answers against the vets' answers (Answer Correctness), then
# fails when a score crosses its limit (scripts/check_regression.py).
# Needs repository secrets OPENAI_API_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY,
# LANGFUSE_BASE_URL and HF_TOKEN (read access to the private data, src/private_data.py).
# Optional DAGSHUB_TOKEN: each run is also logged to MLflow on DagsHub (scripts/log_regression_mlflow.py).
# One run costs about 76 chatbot answers and 12 team runs (~260 model calls).
on:
  schedule:
    - cron: "23 0 * * 1"  # Monday 09:23 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      LANGFUSE_TRACING_ENVIRONMENT: ci
      # Until the Langfuse free plan resets on 2026-11-06 (about 120,000 of 50,000 units used): run the
      # sets here and send nothing (scripts/langfuse_experiments.py --local). Remove both lines after.
      RAGDOG_EXPERIMENTS_LOCAL: "1"
      LANGFUSE_TRACING_ENABLED: "false"
      HF_HUB_OFFLINE: "0"  # the runner downloads the ONNX embedding model once
    steps:
      - name: Check secrets
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$LANGFUSE_PUBLIC_KEY" ] || [ -z "$LANGFUSE_SECRET_KEY" ] || [ -z "$HF_TOKEN" ]; then
            echo "::error::Set OPENAI_API_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, HF_TOKEN (and LANGFUSE_BASE_URL) as repository secrets."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --no-install-project

      - name: Download the private data
        run: .venv/bin/python -m src.private_data

      - name: Name this run
        run: echo "RUN_NAME=ci-$(date -u +%Y-%m-%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: CRAG answer/abstain set
        run: .venv/bin/python scripts/langfuse_experiments.py run crag --name "$RUN_NAME" --description "weekly regression (${{ github.event_name }})"

      - name: Place routing set
        run: .venv/bin/python scripts/langfuse_experiments.py run routing --name "$RUN_NAME" --description "weekly regression (${{ github.event_name }})"

      - name: Care-guide set
        run: .venv/bin/python scripts/langfuse_experiments.py run guide --name "$RUN_NAME" --description "weekly regression (${{ github.event_name }})"

      - name: Visit-prep team set
        run: .venv/bin/python scripts/langfuse_experiments.py run visit --name "$RUN_NAME" --description "weekly regression (${{ github.event_name }})"

      - name: Health answers against the vets' answers (100 consultations)
        # Judged once (docs/wiki/safety-and-evidence.md): about 100 answers in 4 processes. Answer
        # Correctness has the limit; Context Recall and Precision (2026-10-20) are recorded to tell a
        # search drop from an answer drop, about 600 more judge calls. ragas needs its own environment (an older LangChain).
        env:
          SEARCH_BACKEND: ${{ secrets.SEARCH_BACKEND }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          for shard in 0 1 2 3; do
            .venv/bin/python scripts/evaluate_answer_quality.py generate --run 0 --shard "$shard/4" > "answer_gen_$shard.log" 2>&1 &
          done
          wait
          tail -n 2 answer_gen_*.log
          uv run --no-project --python 3.12 --with "ragas==0.4.3" --with "langchain-community<0.4" --with python-dotenv \
            python scripts/evaluate_answer_quality.py judge --repeats 1 --metrics answer_correctness context_recall context_precision --result-name "$RUN_NAME"

      - name: Compare with limits
        # Each set's scores also go to ragdog_eval_history (scripts/eval_history.py) for the trend.
        # The PR quality check (pr-quality.yml) has no database URL: branch runs stay out of it.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RAGDOG_EVAL_HISTORY: "1"
        id: compare
        continue-on-error: true  # the recheck below decides when only stable questions failed
        run: .venv/bin/python scripts/check_regression.py crag "$RUN_NAME" routing "$RUN_NAME" guide "$RUN_NAME" visit "$RUN_NAME" answer "$RUN_NAME"

      - name: Recheck the stable questions that failed
        # As in pr-quality.yml: a stable question that passes two more runs was the grader's wobble.
        if: steps.compare.outcome == 'failure'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RAGDOG_EVAL_HISTORY: "1"
        run: |
          .venv/bin/python scripts/recheck_items.py crag "$RUN_NAME"
          .venv/bin/python scripts/recheck_items.py routing "$RUN_NAME"
          .venv/bin/python scripts/check_regression.py crag "$RUN_NAME" routing "$RUN_NAME" guide "$RUN_NAME" visit "$RUN_NAME" answer "$RUN_NAME"

      - name: Log to MLflow (DagsHub)
        # The same scores as experiment "regression-weekly", one child run per set, for the weekly
        # charts. Also after a failed check (that week matters most); never fails the job itself.
        if: always()
        run: |
          uv run --no-project --python 3.12 --with "mlflow-skinny>=3.4" --with python-dotenv             python scripts/log_regression_mlflow.py "$RUN_NAME" crag routing visit answer

      - name: Keep the item-level results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: regression-${{ env.RUN_NAME }}
          path: output/experiments/
          if-no-files-found: ignore
