name: PR quality check

# The answer-path quality check before merging, only for changes that can move answers: the
# CRAG answer/abstain set (60) and the place routing set (41) with real model calls, which must pass
# four checks against the merged code's baseline (scripts/check_regression.py, tests/data/baselines):
# completeness, absolute floor, relative floor and no failed stable question. About 100 model calls and
# 10-15 minutes, so it runs only when
# - the pull request changes a file on the answer path (ANSWER_PATH below), or
# - someone adds the label quality-check (for any other change worth checking).
# Other pull requests get a skipped job, which a required status check counts as passed.
# The weekly run (regression-eval.yml) still checks everything after merging.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Answer-path change or quality-check label?
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'quality-check') }}
          # Routing (router, places), prompts, abstaining, the graph and its entry, search stores and models, input masking, small talk,
          # the care guides (2026-10-19), and the private data's revision: a new revision changes the material the answers
          # stand on with no answer-path code change (#236, care-guide windows and a corrected leaflet, skipped this check).
          ANSWER_PATH: >-
            ^src/(tools/(router|places|health|report|general|care_guides)\.py|crag\.py|chat_graph\.py|chatbot\.py|resources\.py|supabase_store\.py|hybrid_retrieval\.py|pii\.py|private_data\.py)$
        run: |
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          hits="$(printf '%s\n' "$changed" | grep -E "$ANSWER_PATH" || true)"
          if [ -n "$hits" ] || [ "$LABELLED" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "### Quality check runs: ${hits:-label quality-check}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "### Quality check skipped: no answer-path file changed, no quality-check label" >> "$GITHUB_STEP_SUMMARY"
          fi

  quality:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LANGFUSE_TRACING_ENVIRONMENT: ci
      # Until the Langfuse free plan resets on 2026-11-06 (about 120,000 of 50,000 units used): run the
      # sets here and send nothing (scripts/langfuse_experiments.py --local). Remove both lines after.
      RAGDOG_EXPERIMENTS_LOCAL: "1"
      LANGFUSE_TRACING_ENABLED: "false"
      HF_HUB_OFFLINE: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --no-install-project

      - name: Download the private data
        run: .venv/bin/python -m src.private_data

      - name: Name this run
        run: echo "RUN_NAME=pr-${{ github.event.pull_request.number }}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: CRAG answer/abstain set
        run: .venv/bin/python scripts/langfuse_experiments.py run crag --name "$RUN_NAME" --description "pull request ${{ github.event.pull_request.number }} quality check"

      - name: Place routing set
        run: .venv/bin/python scripts/langfuse_experiments.py run routing --name "$RUN_NAME" --description "pull request ${{ github.event.pull_request.number }} quality check"

      - name: Compare with the weekly limits
        id: compare
        continue-on-error: true  # the recheck below decides when only stable questions failed
        run: .venv/bin/python scripts/check_regression.py crag "$RUN_NAME" routing "$RUN_NAME"

      - name: Recheck the stable questions that failed
        # A stable question that fails once may be the evidence grader's wobble: ask it twice more
        # (scripts/recheck_items.py) and judge again. A real regression fails again.
        if: steps.compare.outcome == 'failure'
        run: |
          .venv/bin/python scripts/recheck_items.py crag "$RUN_NAME"
          .venv/bin/python scripts/recheck_items.py routing "$RUN_NAME"
          .venv/bin/python scripts/check_regression.py crag "$RUN_NAME" routing "$RUN_NAME"

      - name: Keep the item-level results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr-quality-${{ env.RUN_NAME }}
          path: output/experiments/
          if-no-files-found: ignore
