name: Alert on failure

# When a scheduled or deploy workflow fails on main, open a GitHub issue labelled "alert" (GitHub
# emails the repository owner), or comment on the open one for the same workflow, so a failure is
# seen without opening Actions. Covers the weekly regression evaluation and service levels, the
# keep-alive checks of both deployments and the Cloud Run deploy.
on:
  workflow_run:
    workflows:
      - Weekly regression evaluation
      - Weekly service levels
      - Keep deployed app awake and working
      - Deploy to Cloud Run
      - Roll back the API
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Open or update the alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          gh label create alert --color B60205 --description "A scheduled or deploy workflow failed" 2>/dev/null || true
          title="Failed: $WORKFLOW"
          body="$WORKFLOW failed ($EVENT, commit ${SHA::7}). Run: $RUN_URL"
          number="$(gh issue list --label alert --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label alert --body "$body"
          fi
